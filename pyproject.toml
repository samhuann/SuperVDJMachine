[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supervdj"
version = "1.0.0"
description = "OLGA/SONNIA posteriors over TCR V and J genes from CDR3 sequences."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Samuel Huang", email = "shuan143@jh.edu" }]
keywords = ["TCR", "CDR3", "OLGA", "SONNIA", "Pgen", "VDJ"]
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "scipy>=1.7",
    "tqdm>=4.0",
    "olga>=1.3.0",
    "sonnia>=0.4.0",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
figures = ["matplotlib>=3.8", "seaborn>=0.13"]

[project.scripts]
supervdj = "supervdj.run:main"

[tool.setuptools.package-data]
supervdj = ["data/*.tsv"]

[tool.setuptools.packages.find]
where = ["."]
include = ["supervdj*", "ingest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
